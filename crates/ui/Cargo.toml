# SPDX-License-Identifier: MIT

[package]
name        = "cobblestone-ui"
description = "Cobblestone graphical UI — Dioxus (desktop + web)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "cobblestone_ui"
path = "src/lib.rs"

[[bin]]
name = "cobblestone-web"
path = "src/main.rs"
required-features = ["web"]

[features]
default  = []
web      = ["dioxus/web", "dep:gloo-net", "dep:gloo-timers"]
desktop  = ["dioxus/desktop", "dep:cobblestone-core", "dep:tokio", "dep:arboard"]

[dependencies]
dioxus = { version = "0.7.10", default-features = true, features = [] }
serde  = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
ammonia = "4"
futures = "0.3"

cobblestone-core = { path = "../core", optional = true }
gloo-net = { version = "0.6", optional = true, features = ["http", "json"] }
gloo-timers = { version = "0.3", optional = true, features = ["futures"] }
tokio = { version = "1", optional = true, features = ["time", "rt"] }
arboard = { version = "3", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlImageElement",
    "DragEvent",
    "DataTransfer",
    "Navigator",
    "Clipboard",
    "Storage",
] }

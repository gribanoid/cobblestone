[package]
name        = "cobblestone-core"
description = "Cobblestone core — shared storage and note logic"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow  = "1"
chrono  = { version = "0.4", features = ["serde"] }
dirs    = "5"
serde   = { version = "1", features = ["derive"] }
tempfile = "3"
toml    = "0.8"

[target.'cfg(any(target_vendor = "apple", target_os = "linux", target_os = "android", target_os = "redox"))'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
filetime = "0.2"

# SPDX-License-Identifier: MIT

[package]
name        = "cobblestone-editor"
description = "Near-WYSIWYG Markdown editor for Cobblestone (Dioxus)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "cobblestone_editor"
path = "src/lib.rs"

[features]
default = []
desktop = ["dep:arboard", "dep:image"]

[dependencies]
dioxus = { version = "0.7.10", default-features = true, features = [] }
arboard = { version = "3", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

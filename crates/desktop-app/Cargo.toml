# SPDX-License-Identifier: MIT

[package]
name        = "cobblestone-desktop"
description = "Cobblestone desktop app — Dioxus + cobblestone-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "cobblestone"
path = "src/main.rs"

[dependencies]
cobblestone-core = { path = "../core" }
cobblestone-ui   = { path = "../ui", features = ["desktop"] }
dioxus = { version = "0.7.10", features = ["desktop"] }

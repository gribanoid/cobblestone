[package]
name        = "cobblestone-plugin-templates-engine"
description = "Dynamic note templates (dates, title, cursor) for Cobblestone"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chrono                 = { version = "0.4", default-features = false, features = ["clock", "std"] }
cobblestone-plugin-api = { path = "../../plugin-api" }
serde                  = { version = "1", features = ["derive"] }
serde_json             = "1"

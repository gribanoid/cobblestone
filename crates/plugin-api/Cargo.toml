[package]
name        = "cobblestone-plugin-api"
description = "First-party Rust plugin surface for Cobblestone"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cobblestone-plugin-bridge = { path = "../plugin-bridge" }
serde                     = { version = "1", features = ["derive"] }
serde_json                = "1"
tempfile                  = "3"
thiserror                 = "2"

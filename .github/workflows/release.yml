name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: cobblestone-macos-aarch64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: cobblestone-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: cobblestone-windows-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Build desktop release
        run: cargo build -p cobblestone-desktop --release --target ${{ matrix.target }}

      - name: Package binary (Unix)
        if: runner.os != 'Windows'
        run: |
          bin="target/${{ matrix.target }}/release/cobblestone"
          chmod +x "$bin"
          cp "$bin" "${{ matrix.artifact }}"
          tar -czf "${{ matrix.artifact }}.tar.gz" "${{ matrix.artifact }}" LICENSE NOTICE

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        run: |
          Copy-Item "target/${{ matrix.target }}/release/cobblestone.exe" "${{ matrix.artifact }}.exe"
          Compress-Archive -Path "${{ matrix.artifact }}.exe", LICENSE, NOTICE -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Cobblestone ${{ github.ref_name }}
          draft: true
          files: dist/*
          body: |
            ## Downloads

            | Platform | File |
            |----------|------|
            | macOS (Apple Silicon) | `cobblestone-macos-aarch64.tar.gz` |
            | Linux (x86_64) | `cobblestone-linux-x86_64.tar.gz` |
            | Windows (x86_64) | `cobblestone-windows-x86_64.zip` |

            **macOS (unsigned build):** Gatekeeper may block the binary. Fix:

            ```bash
            xattr -cr ./cobblestone-macos-aarch64
            chmod +x ./cobblestone-macos-aarch64
            ./cobblestone-macos-aarch64
            ```

            **Linux:** ensure WebKitGTK is installed (`libwebkit2gtk-4.1-0` on Debian/Ubuntu).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

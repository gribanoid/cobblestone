[workspace]
members = [
    "crates/core",
    "crates/cli",
    "crates/ui",
    "crates/editor",
    "crates/desktop-app",
    "crates/plugin-api",
    "crates/plugin-bridge",
    "crates/plugin-host",
    "crates/plugins/periodic-notes",
    "crates/plugins/tasks",
    "crates/plugins/quick-capture",
    "crates/plugins/templates-engine",
    "crates/plugins/omnisearch",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[profile.release]
opt-level = "s"
strip     = true

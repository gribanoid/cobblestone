# cargo-deny — dependency advisories / licenses / bans
# https://embarkstudios.github.io/cargo-deny/
# Schema: cargo-deny 0.20+ (`unmaintained`/`unsound` use scope, not lint level)

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "wasm32-unknown-unknown" },
]

[advisories]
yanked = "deny"
# Scope: all | workspace | transitive | none
# Fail only when *our* crates are unsound; transitive GUI/TUI deps (dioxus/ratatui)
# still surface in `cargo deny check` logs when set to "all".
unmaintained = "none"
unsound = "workspace"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
